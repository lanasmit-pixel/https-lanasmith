<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Free Ann Arbor First-Time Buyer Guide</title>

  <style>
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
      margin: 0;
      padding: 30px 16px;
      background: #fff;
      color: #1f2933;
    }

    .card {
      max-width: 440px;
      margin: 0 auto;
    }

    h2 {
      margin: 0 0 6px;
      font-size: 1.6rem;
    }

    p.sub {
      margin: 0 0 20px;
      color: #52606d;
      line-height: 1.5;
    }

    label {
      display: block;
      font-size: .9rem;
      margin: 14px 0 5px;
    }

    input[type="text"],
    input[type="email"],
    input[type="tel"],
    select {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      border: 1px solid #cbd2d9;
      border-radius: 8px;
      font-size: 1rem;
      background: white;
    }

    .consent {
      display: flex;
      gap: 8px;
      align-items: flex-start;
      margin-top: 18px;
      color: #52606d;
      font-size: .85rem;
      line-height: 1.4;
    }

    .consent input {
      margin-top: 3px;
      flex-shrink: 0;
    }

    .consent label {
      margin: 0;
      font-size: .85rem;
    }

    button {
      width: 100%;
      margin-top: 18px;
      padding: 14px;
      border: 0;
      border-radius: 8px;
      background: #1d4ed8;
      color: white;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
    }

    .hp {
      position: absolute;
      left: -9999px;
    }
  </style>
</head>

<body>

  <div class="card">

    <h2>Free Ann Arbor First-Time Buyer Guide</h2>

    <p class="sub">
      Property tax uncapping, down payment help, and what to expect.
      We'll email it to you.
    </p>

    <form
      action="https://script.google.com/macros/s/AKfycbxQQuHZCAYGEEVolGpBFYxJRWmCw7G3zDtWwrIk8z1uGkFD5BW4fN64z2dVKWse-EhN-g/exec"
      method="POST"
    >

      <label for="name">First name</label>
      <input
        type="text"
        id="name"
        name="name"
        autocomplete="given-name"
        required
      >

      <label for="lastName">Last name</label>
      <input
        type="text"
        id="lastName"
        name="lastName"
        autocomplete="family-name"
        required
      >

      <label for="email">Email</label>
      <input
        type="email"
        id="email"
        name="email"
        autocomplete="email"
        required
      >

      <label for="phone">Phone number</label>
      <input
        type="tel"
        id="phone"
        name="phone"
        autocomplete="tel"
        required
      >

      <label for="interest">What are you looking for?</label>

      <select id="interest" name="interest" required>
        <option value="">Select one</option>
        <option value="Buying a home">Buying a home</option>
        <option value="Selling a home">Selling a home</option>
        <option value="Investing">Investing</option>
        <option value="Just learning">Just learning</option>
      </select>

      <input
        class="hp"
        type="text"
        name="website"
        tabindex="-1"
        autocomplete="off"
        aria-hidden="true"
      >

      <div class="consent">

        <input
          type="checkbox"
          id="consent"
          name="consent"
          value="yes"
          required
        >

        <label for="consent">
          I agree to be contacted by Lana Smith | Keller Williams Ann Arbor
          about my home-buying goals and to receive the requested guide.
          I can unsubscribe from future marketing emails at any time.
        </label>

      </div>

      <button type="submit">
        Send me the guide
      </button>

    </form>

  </div>

</body>
</html>
